<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicité</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
}

#continue{
    position:fixed;
    bottom:20px;
    right:20px;
    display:none;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    background:#0078ff;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<video id="adVideo" controls autoplay>
    /pub/2026/cloud.mp4
</video>

<button id="continue">Continuer</button>

<script>
const params = new URLSearchParams(window.location.search);
const redirectUrl = params.get("redirect") || "/";

const video = document.getElementById("adVideo");
const continueBtn = document.getElementById("continue");

// Son activé
video.muted = false;
video.volume = 1;

// Fin de la vidéo
video.addEventListener("ended", () => {
    continueBtn.style.display = "block";
    window.location.href = redirectUrl;
});

// Bouton manuel
continueBtn.addEventListener("click", () => {
    window.location.href = redirectUrl;
});
</script>

</body>
</html>
