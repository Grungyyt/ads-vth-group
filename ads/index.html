
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTH Ads</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#ad-container {
    width: 100vw;
    height: 100vh;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

#start-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    color: white;
    z-index: 10;
}

#logo {
    width: 180px;
}

#start-btn {
    background: #0066ff;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

#start-btn:disabled {
    opacity: .6;
}

#ad-label {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(0,0,0,.7);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 5;
    display: none;
}

#status {
    color: white;
    text-align: center;
    max-width: 90%;
}
</style>
</head>

<body>

<div id="ad-container">

    <div id="start-screen">
        <img id="logo"
             src="https://storage.vth-mc.fr/vth.png"
             alt="VTH">

        <button id="start-btn">
            ▶ Lancer la publicité
        </button>

        <p id="status" aria-live="polite"></p>
    </div>

    <div id="ad-label">
        Publicité sponsorisée
    </div>

    <video id="video" playsinline preload="auto">
        <source
            src="https://storage.vth-mc.fr/pub/2026/1.mp4"
            type="video/mp4">
    </video>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const token = params.get("token");
const serverId = params.get("server_id");
const redirect = params.get("redirect");

const video = document.getElementById("video");
const startScreen = document.getElementById("start-screen");
const startBtn = document.getElementById("start-btn");
const status = document.getElementById("status");
const adLabel = document.getElementById("ad-label");

let destination;

try {
    destination = new URL(redirect || "");

    if (
        destination.protocol !== "https:" ||
        destination.hostname !== "panel.serv-vth.fun" ||
        !token ||
        !/^[a-f0-9]{64}$/i.test(token) ||
        !serverId ||
        !/^[a-zA-Z0-9-]{1,64}$/.test(serverId)
    ) {
        throw new Error("Invalid parameters");
    }
} catch {
    startBtn.disabled = true;
    status.textContent =
        "Lien invalide. Retournez au panel et réessayez.";
}

let started = false;
let completed = false;

startBtn.addEventListener("click", async () => {
    if (started) return;

    started = true;
    startScreen.style.display = "none";
    adLabel.style.display = "block";

    video.style.display = "block";
    video.muted = false;
    video.volume = 1;

    try {
        await video.play();
    } catch {
        started = false;
        video.style.display = "none";
        startScreen.style.display = "flex";
        status.textContent = "Impossible de lancer la vidéo.";
    }
});

document.addEventListener("visibilitychange", () => {
    if (!started || completed) return;

    if (document.hidden) {
        video.pause();
    } else if (!video.ended) {
        video.play().catch(() => {});
    }
});

video.addEventListener("ended", async () => {
    if (completed) return;

    completed = true;
    video.pause();

    startScreen.style.display = "flex";
    startBtn.style.display = "none";
    status.textContent = "Publicité terminée. Validation en cours…";

    try {
        const response = await fetch("/api/complete", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                token: token,
                server_id: serverId
            })
        });

        const result = await response.json();

        if (!response.ok || result.ok !== true) {
            throw new Error("Validation failed");
        }

        status.textContent = "Validation réussie. Redirection…";

        window.location.replace(destination.href);

    } catch {
        completed = false;
        status.textContent =
            "Échec de validation. Rechargez la page pour réessayer.";
    }
});

document.addEventListener("contextmenu", event => {
    event.preventDefault();
});
</script>

</body>
</html>
