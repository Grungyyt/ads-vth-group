<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTH Ads</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#ad-container{
    width:100vw;
    height:100vh;
    position:relative;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

#start-screen{
    position:absolute;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    z-index:10;
}

#logo{
    width:180px;
    margin-bottom:25px;
}

#start-btn{
    background:#0066ff;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

#start-btn:hover{
    background:#0050cc;
}

#ad-label{
    position:absolute;
    top:15px;
    right:15px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:8px 12px;
    border-radius:8px;
    z-index:5;
    display:none;
}
</style>
</head>
<body>

<div id="ad-container">

    <div id="start-screen">
        <img id="logo" src="https://storage.vth-mc.fr/vth.png" alt="VTH">
        <button id="start-btn">▶ Lancer la publicité</button>
    </div>

    <div id="ad-label">
        Publicité sponsorisée
    </div>

    <video id="video" playsinline preload="auto">
        <source src="https://storage.vth-mc.fr/pub/2026/1.mp4" type="video/mp4">
    </video>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect") || "/";

const video = document.getElementById("video");
const startScreen = document.getElementById("start-screen");
const startBtn = document.getElementById("start-btn");
const adLabel = document.getElementById("ad-label");

let isStarted = false;

startBtn.addEventListener("click", async () => {
    isStarted = true;
    startScreen.style.display = "none";
    adLabel.style.display = "block";

    video.style.display = "block";
    video.muted = false;
    video.volume = 1;

    await video.play();
});

// Pause / Reprise automatique quand on change d'onglet
document.addEventListener("visibilitychange", () => {
    if (!isStarted) return;

    if (document.hidden) {
        video.pause();
    } else {
        video.play();
    }
});

video.addEventListener("ended", () => {
    window.location.href = redirect;
});

document.addEventListener("contextmenu", e => e.preventDefault());
</script>

</body>
</html>
